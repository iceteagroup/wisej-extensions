name: Build & Pack Wisej.NET Standard Extensions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      assembly_version:
        description: "Optional AssemblyFileVersion (e.g. 1.2.3.4)"
        required: false
        default: ""
      package_channel:
        description: "Channel appended to filename (test/preview/release)"
        required: false
        default: "test"
        type: choice
        options:
          - test
          - preview
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, windows]
    permissions:
      actions: write
      contents: write
      checks: write
      pull-requests: write
      packages: write

    steps:
      - name: Ensure Git available for checkout
        shell: powershell
        run: |
          $gitCmdPath = "C:\Program Files\Git\cmd"
          $gitBinPath = "C:\Program Files\Git\bin"
          if (Test-Path $gitCmdPath) {
            $gitCmdPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if (Test-Path $gitBinPath) {
            $gitBinPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Get-Command git -ErrorAction SilentlyContinue | Out-Null

      - name: Checkout Standard Extensions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect existing .NET SDK
        id: dotnet
        shell: powershell
        run: |
          $globalJsonPath = "global.json"
          $requiredVersion = $null
          if (Test-Path $globalJsonPath) {
            try {
              $requiredVersion = (Get-Content $globalJsonPath -Raw | ConvertFrom-Json).sdk.version
            } catch {
              $requiredVersion = $null
            }
          }

          $dotnetCmd = Get-Command dotnet -ErrorAction SilentlyContinue
          $useSystem = $false
          $dotnetRoot = ""

          if ($dotnetCmd) {
            $dotnetRoot = Split-Path $dotnetCmd.Source
            if ([string]::IsNullOrWhiteSpace($requiredVersion)) {
              $useSystem = $true
            } else {
              $sdks = & dotnet --list-sdks 2>$null
              $pattern = ("^{0}\\s" -f [regex]::Escape($requiredVersion))
              if ($sdks -match $pattern) {
                $useSystem = $true
              }
            }
          }

          "use_system=$useSystem" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($useSystem) {
            "DOTNET_INSTALL_DIR=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $dotnetRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Using system .NET SDK from $dotnetRoot."
          } else {
            Write-Host "System .NET SDK not available; will install to runner temp."
          }

      - name: Configure .NET install dir
        if: ${{ steps.dotnet.outputs.use_system != 'true' }}
        shell: powershell
        run: |
          $baseDir = $env:RUNNER_TOOL_CACHE
          if ([string]::IsNullOrWhiteSpace($baseDir)) {
            $baseDir = "C:\dotnet"
          } else {
            $baseDir = Join-Path $baseDir "dotnet"
          }
          $dotnetDir = $baseDir
          New-Item -ItemType Directory -Force -Path $dotnetDir | Out-Null
          "DOTNET_INSTALL_DIR=$dotnetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOTNET_ROOT=$dotnetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dotnetDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup .NET
        if: ${{ steps.dotnet.outputs.use_system != 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Ensure gzip available for cache
        shell: powershell
        run: |
          $gitUsrBin = "C:\Program Files\Git\usr\bin"
          if (Test-Path $gitUsrBin) {
            $gzip = Join-Path $gitUsrBin "gzip.exe"
            if (Test-Path $gzip) {
              $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Warning "gzip.exe not found in $gitUsrBin; cache save may fail."
            }
          } else {
            Write-Warning "Git usr bin not found at $gitUsrBin; cache save may fail."
          }

      - run: dotnet --info

      - name: Configure NuGet sources (GitHub + nuget.org)
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}"
          $src = "https://nuget.pkg.github.com/$owner/index.json"

          dotnet nuget remove source github 2>$null
          if ($LASTEXITCODE -ne 0) { $LASTEXITCODE = 0 }
          dotnet nuget add source "$src" `
            --name "github" `
            --username "$owner" `
            --password "${{ secrets.GITHUB_TOKEN }}" `
            --store-password-in-clear-text

          dotnet nuget remove source nuget.org 2>$null
          if ($LASTEXITCODE -ne 0) { $LASTEXITCODE = 0 }
          dotnet nuget add source "https://api.nuget.org/v3/index.json" --name "nuget.org"
          dotnet nuget list source

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Wisej.Extensions.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache .NET workloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_INSTALL_DIR }}\packs
            ${{ env.DOTNET_INSTALL_DIR }}\sdk-manifests
            ${{ env.DOTNET_INSTALL_DIR }}\workloads
          key: workloads-${{ runner.os }}-${{ hashFiles('Wisej.Extensions.sln', 'Directory.Build.props', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            workloads-${{ runner.os }}-

      - name: Ensure DOTNET_ROOT writable
        shell: powershell
        run: |
          if (-not $env:DOTNET_ROOT) {
            Write-Error "DOTNET_ROOT is not set."
            exit 1
          }
          Write-Host "Ensuring write access for $env:DOTNET_ROOT..."
          $user = (whoami)
          icacls $env:DOTNET_ROOT /grant "${user}:(OI)(CI)F" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Warning "icacls failed for ${user} on $env:DOTNET_ROOT"; $LASTEXITCODE = 0 }
          icacls $env:DOTNET_ROOT /grant "Administrators:(OI)(CI)F" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Warning "icacls failed for Administrators on $env:DOTNET_ROOT"; $LASTEXITCODE = 0 }

      - name: Ensure Android workload installed
        shell: powershell
        run: |
          $packsRoot = Join-Path $env:DOTNET_ROOT "packs\Microsoft.Android.Sdk.Windows"
          $hasPack = (Test-Path $packsRoot) -and ((Get-ChildItem -Path $packsRoot -Directory -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0)
          if ($hasPack) {
            Write-Host "Android workload pack already present in $packsRoot."
            return
          }

          $workloads = & dotnet workload list 2>$null
          if ($workloads -match '\bandroid\b') {
            Write-Host "Android workload already listed."
            return
          }

          Write-Host "Installing Android workload..."
          dotnet workload install android

      - name: Install NuGet.exe
        shell: powershell
        run: |
          $nugetCmd = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if (-not $nugetCmd) {
            $nugetPath = Join-Path $env:GITHUB_WORKSPACE "nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetPath
            $nugetDir = Split-Path $nugetPath
          } else {
            $nugetDir = Split-Path $nugetCmd.Source
          }

          $nugetDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Determine assembly version
        id: determine_version
        shell: powershell
        run: |
          $provided = "${{ github.event.inputs.assembly_version }}"
          if (-not [string]::IsNullOrWhiteSpace($provided)) {
            Write-Warning "Manual assembly version input is ignored. Version will be determined automatically."
          }

          $owner = "${{ github.repository_owner }}"
          $packageName = $null
          $propsPath = "Directory.Build.props"
          if (Test-Path $propsPath) {
            try {
              [xml]$propsXml = Get-Content $propsPath -Raw
              $packageName = $propsXml.Project.PropertyGroup.WisejPackageName
              if ([string]::IsNullOrWhiteSpace($packageName)) {
                Write-Warning "WisejPackageName property not found. Using default package id."
              }
            } catch {
              Write-Warning "Unable to parse Directory.Build.props for package name: $_"
            }
          }
          if ([string]::IsNullOrWhiteSpace($packageName)) {
            $packageName = "Wisej-4"
          }

          $sources = @(
            "https://api.nuget.org/v3/index.json",
            "https://nuget.pkg.github.com/$owner/index.json"
          )

          $semanticVersions = @()
          foreach ($source in $sources) {
            try {
              $listOutput = & nuget.exe list $packageName -Source $source -AllVersions -Prerelease 2>$null
              foreach ($line in $listOutput) {
                if ($line -match "^$packageName\s+(?<ver>[0-9A-Za-z\.-\+]+)$") {
                  $ver = $Matches['ver']
                  try {
                    $semVer = [System.Management.Automation.SemanticVersion]::Parse($ver)
                    $semanticVersions += [PSCustomObject]@{
                      Original = $ver
                      Semantic = $semVer
                    }
                  } catch {
                    Write-Warning "Unable to parse semantic version '$ver' from source '$source'."
                  }
                }
              }
            } catch {
              Write-Warning "Failed to query ${source} for ${packageName}: $_"
            }
          }

          $latestVersion = $null
          if ($semanticVersions.Count -gt 0) {
            $latestVersion = ($semanticVersions | Sort-Object Semantic -Descending | Select-Object -First 1).Semantic.Version
            Write-Host "Latest published version for ${packageName}: $($latestVersion)"
          } elseif (Test-Path $propsPath) {
            try {
              [xml]$propsXmlForVersion = Get-Content $propsPath -Raw
              $fallbackVersion = $propsXmlForVersion.Project.PropertyGroup.FileVersion
              if (-not [string]::IsNullOrWhiteSpace($fallbackVersion)) {
                $latestVersion = [System.Version]::Parse($fallbackVersion)
                Write-Host "Using Directory.Build.props FileVersion as fallback: $fallbackVersion"
              }
            } catch {
              Write-Warning "Failed to load fallback version from Directory.Build.props: $_"
            }
          }

          if (-not $latestVersion) {
            $latestVersion = [System.Version]::new(4, 0, 0, 0)
            Write-Host "Defaulting base version to $latestVersion"
          }

          $baseMajor = $latestVersion.Major
          $baseMinor = $latestVersion.Minor
          $baseBuild = if ($latestVersion.Build -ge 0) { $latestVersion.Build } else { 0 }
          $baseRevision = if ($latestVersion.Revision -ge 0) { $latestVersion.Revision } else { 0 }
          $nextVersion = [System.Version]::new($baseMajor, $baseMinor, $baseBuild, $baseRevision + 1)
          Write-Host "Next assembly version: $($nextVersion.ToString())"

          $versionString = $nextVersion.ToString()
          "assembly_version=$versionString" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ASSEMBLY_VERSION=$versionString" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update AssemblyInfo version
        if: ${{ steps.determine_version.outputs.assembly_version != '' }}
        shell: powershell
        run: |
          $newVersion = "${{ steps.determine_version.outputs.assembly_version }}"
          Write-Host "Setting AssemblyInfo versions to $newVersion"

          Get-ChildItem -Path "." -Recurse -Filter "AssemblyInfo.cs" | ForEach-Object {
            $path = $_.FullName
            $content = Get-Content $path -Raw
            $updated = $content `
              -replace '(?<=\[assembly:\s*AssemblyFileVersion\(")[^"]+(?="\)\s*\])', $newVersion `
              -replace '(?<=\[assembly:\s*AssemblyInformationalVersion\(")[^"]+(?="\)\s*\])', $newVersion
            if ($updated -ne $content) {
              Set-Content -Path $path -Value $updated -Encoding UTF8
              Write-Host "Updated: $path"
            }
          }

          $propsPath = "Directory.Build.props"
          if (Test-Path $propsPath) {
            $propsContent = Get-Content $propsPath -Raw
            $propsUpdated = $propsContent -replace '(?<=<FileVersion>)[^<]+(?=</FileVersion>)', $newVersion
            if ($propsUpdated -ne $propsContent) {
              Set-Content -Path $propsPath -Value $propsUpdated -Encoding UTF8
              Write-Host "Updated: $propsPath"
            }
          }

      - name: Restore workloads for mobile builds
        run: |
          dotnet workload restore Wisej.Extensions.sln

      - name: Restore dependencies
        run: dotnet restore Wisej.Extensions.sln

      - name: Build (Release)
        run: dotnet build Wisej.Extensions.sln --configuration Release --no-incremental /m

      - name: Build PlayWright (Release)
        run: dotnet build Wisej.Ext.PlayWright/Wisej.Ext.PlayWright/Wisej.Ext.PlayWright.csproj --configuration Release --no-incremental /m

      - name: Stage build outputs for packing
        shell: powershell
        run: |
          function Copy-TfmContent {
            param(
              [System.IO.DirectoryInfo]$SourceDir,
              [string[]]$DistroBins
            )

            if (-not $SourceDir -or -not (Test-Path $SourceDir.FullName)) {
              return
            }

            foreach ($distroBin in $DistroBins) {
              if ([string]::IsNullOrWhiteSpace($distroBin)) {
                continue
              }

              $tfmName = $SourceDir.Name
              $destination = Join-Path $distroBin $tfmName
              New-Item -ItemType Directory -Force -Path $destination | Out-Null

              Write-Host "Staging $($SourceDir.FullName) -> $destination"
              Copy-Item -Path (Join-Path $SourceDir.FullName '*') -Destination $destination -Recurse -Force
            }
          }

          $currentDir = Get-Item -LiteralPath $PWD
          $distroRoots = @()

          $distroRoots += Join-Path $currentDir.FullName 'Distro'
          if ($currentDir.Parent) {
            $distroRoots += Join-Path $currentDir.Parent.FullName 'Distro'
          }

          $nuspecFiles = Get-ChildItem -Path $PWD -Recurse -Include *.nuspec,*.NuSpec -File -ErrorAction SilentlyContinue
          foreach ($nuspec in $nuspecFiles) {
            $nuspecDir = Split-Path $nuspec.FullName -Parent
            $nuspecRoot = if ($nuspecDir) { Split-Path $nuspecDir -Parent } else { $null }
            if ($nuspecRoot) {
              $distroRoots += Join-Path $nuspecRoot 'Distro'
            }
          }

          $distroRoots = $distroRoots | Select-Object -Unique

          $distroBins = @()
          foreach ($distroRoot in $distroRoots) {
            if (Test-Path $distroRoot) {
              Remove-Item -Path $distroRoot -Recurse -Force
            }

            $binPath = Join-Path $distroRoot 'bin'
            New-Item -ItemType Directory -Force -Path $binPath | Out-Null
            $distroBins += $binPath
          }

          $projectFiles = Get-ChildItem -Path $PWD -Recurse -Filter '*.csproj' -File -ErrorAction SilentlyContinue
          foreach ($proj in $projectFiles) {
            $releaseDir = Join-Path $proj.Directory.FullName 'bin/Release'
            if (-not (Test-Path $releaseDir)) {
              continue
            }

            $targetFrameworkDirs = Get-ChildItem -Path $releaseDir -Directory -ErrorAction SilentlyContinue
            foreach ($tfmDir in $targetFrameworkDirs) {
              Copy-TfmContent -SourceDir $tfmDir -DistroBins $distroBins
            }
          }

          $rootBin = Join-Path $PWD 'bin'
          if (Test-Path $rootBin) {
            $rootTfms = Get-ChildItem -Path $rootBin -Directory -ErrorAction SilentlyContinue
            foreach ($tfmDir in $rootTfms) {
              Copy-TfmContent -SourceDir $tfmDir -DistroBins $distroBins
            }
          }

      - name: Pack NuGet
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null

          $version = "${{ steps.determine_version.outputs.assembly_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Assembly version could not be determined."
            exit 1
          }

          $channel = "${{ github.event.inputs.package_channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) {
            $channel = 'release'
          }
          $validChannels = @('test','preview','release')
          if ($validChannels -notcontains $channel) {
            Write-Host "Invalid channel '$channel' provided. Falling back to 'release'."
            $channel = 'release'
          }

          $nuspecs = Get-ChildItem -Path "." -Recurse -Include *.nuspec,*.NuSpec -File
          if (-not $nuspecs) {
            Write-Warning "No .nuspec files found. Skipping NuGet packing."
            exit 0
          }

          $nugetPath = (Get-Command nuget.exe -ErrorAction Stop).Source
          $artifactsDir = (Resolve-Path "./artifacts").Path
          $jobs = @()

          foreach ($nuspec in $nuspecs) {
            $jobs += Start-Job -ArgumentList $nuspec.FullName, $nuspec.BaseName, $version, $channel, $nugetPath, $artifactsDir -ScriptBlock {
              param($nuspecPath, $nuspecBaseName, $version, $channel, $nugetPath, $artifactsDir)
              $ErrorActionPreference = 'Stop'

              if (-not (Test-Path $nuspecPath)) {
                Write-Warning "Skipping missing nuspec at $nuspecPath"
                return
              }

              $nuspecFile = Get-Item -LiteralPath $nuspecPath
              $nuspecDirectory = $nuspecFile.Directory
              if (-not $nuspecDirectory) {
                Write-Warning "Skipping $nuspecPath because the directory could not be resolved."
                return
              }

              $adjustedNuspecPath = $nuspecPath
              $shouldUseTemp = $false
              try {
                [xml]$nuspecXml = Get-Content $nuspecPath -Raw
                $filesNodes = @()
                if ($nuspecXml.package.files) {
                  $filesNodes = @($nuspecXml.package.files.file)
                }

                foreach ($fileNode in $filesNodes) {
                  if (-not $fileNode -or -not $fileNode.src) {
                    continue
                  }

                  $srcValue = $fileNode.src.ToString()
                  if (-not [string]::IsNullOrWhiteSpace($srcValue)) {
                    $resolvedPattern = $srcValue
                    if (-not [System.IO.Path]::IsPathRooted($srcValue)) {
                      $resolvedPattern = Join-Path $nuspecDirectory.FullName $srcValue
                    }
                    $matches = Get-ChildItem -Path $resolvedPattern -ErrorAction SilentlyContinue
                    if (-not $matches) {
                      if (-not $missingNodes) { $missingNodes = @() }
                      $missingNodes += $fileNode
                      Write-Warning ("Removing missing file entry '{0}' from {1}" -f $srcValue, $nuspecFile.Name)
                      $shouldUseTemp = $true
                      continue
                    }
                  }
                  if ($srcValue -match '(?i)Wisej\.png$' -and -not ($srcValue -match '^\.\.\\')) {
                    $resolvedPath = Join-Path $nuspecDirectory.FullName $srcValue
                    if (-not (Test-Path $resolvedPath)) {
                      $parent = $nuspecDirectory.Parent
                      if ($parent) {
                        $iconCandidates = @(
                          Join-Path $parent.FullName "Wisej.png",
                          Join-Path $parent.FullName "wisej.png"
                        ) | Where-Object { Test-Path $_ }

                        if ($iconCandidates.Count -gt 0) {
                          $iconLeaf = Split-Path $iconCandidates[0] -Leaf
                          $fileNode.src = "..\\$iconLeaf"
                          Write-Host "Updated icon source for $($nuspecFile.Name) to ..\\$iconLeaf"
                          $shouldUseTemp = $true
                        } else {
                          Write-Warning "Wisej.png not found for $($nuspecFile.Name)."
                        }
                      } else {
                        Write-Warning "Cannot locate parent directory for $($nuspecFile.Name) to resolve Wisej.png."
                      }
                    }
                  }
                }

                if ($missingNodes) {
                  foreach ($missingNode in $missingNodes) {
                    if ($missingNode -and $missingNode.ParentNode) {
                      [void]$missingNode.ParentNode.RemoveChild($missingNode)
                    }
                  }
                }

                if ($shouldUseTemp) {
                  $tempNuspecDir = Join-Path $env:TEMP "wisej-nuspec"
                  New-Item -ItemType Directory -Force -Path $tempNuspecDir | Out-Null
                  $tempPath = Join-Path $tempNuspecDir ("$([Guid]::NewGuid().ToString('N'))-$($nuspecFile.Name)")
                  $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                  $writer = New-Object System.IO.StreamWriter($tempPath, $false, $utf8NoBom)
                  $nuspecXml.Save($writer)
                  $writer.Close()
                  $adjustedNuspecPath = $tempPath
                }
              } catch {
                Write-Warning ("Failed to adjust nuspec {0}: {1}" -f $nuspecPath, $_)
              }

              $tempDir = Join-Path $env:TEMP ("wisej-pack-" + [Guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

              Write-Host "Packing $nuspecPath with version $version"
              & $nugetPath pack $adjustedNuspecPath -Version $version -OutputDirectory $tempDir -Properties "version=$version"
              if ($LASTEXITCODE -ne 0) {
                throw "nuget.exe pack failed for $nuspecPath (exit $LASTEXITCODE)"
              }

              $pkgId = $null
              try {
                [xml]$nuspecXml = Get-Content $nuspecPath -Raw
                $pkgId = $nuspecXml.package.metadata.id
              } catch {
                Write-Warning ("Unable to parse package id for {0}: {1}" -f $nuspecPath, $_)
              }

              if ([string]::IsNullOrWhiteSpace($pkgId)) {
                $pkgId = $nuspecBaseName
              }

              $expected = Join-Path $tempDir "$pkgId.$version.nupkg"
              if (-not (Test-Path $expected)) {
                $built = Get-ChildItem $tempDir -Filter "$pkgId*.nupkg" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($built) {
                  $expected = $built.FullName
                } else {
                  Write-Warning "No package file found for $pkgId after packing."
                  return
                }
              }

              $destPath = Join-Path $artifactsDir ("$pkgId-$channel-$version.nupkg")
              Move-Item -Force $expected $destPath
              Write-Host "Renamed package to $destPath"
            }
          }

          $jobs | Wait-Job | Out-Null
          $failed = $jobs | Where-Object { $_.State -eq 'Failed' }
          $jobs | Receive-Job -ErrorAction Continue | Out-Null
          $jobs | Remove-Job | Out-Null
          if ($failed) {
            throw "One or more NuGet pack jobs failed."
          }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: ${{ github.event_name != 'pull_request' }}
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}"
          $src = "https://nuget.pkg.github.com/$owner/index.json"

          Get-ChildItem "./artifacts" -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.FullName)"
            dotnet nuget push $_.FullName `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --source "$src" `
              --skip-duplicate
          }

      - name: Commit version bump
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.assembly_version != '' }}
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump AssemblyInfo version to ${{ github.event.inputs.assembly_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "No version changes to commit."
          }
