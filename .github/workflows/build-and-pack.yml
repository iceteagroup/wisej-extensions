name: Build & Pack Wisej.NET Standard Extensions

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pack:
        description: "Build and publish NuGet package?"
        required: false
        default: "false"
      assembly_version:
        description: "Optional AssemblyFileVersion (e.g. 1.2.3.4)"
        required: false
        default: ""
      package_channel:
        description: "Channel appended to filename (test/preview/release)"
        required: false
        default: "test"
        type: choice
        options:
          - test
          - preview
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout Standard Extensions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet --info

      - name: Configure NuGet sources (GitHub + nuget.org)
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          SRC="https://nuget.pkg.github.com/${OWNER}/index.json"
          dotnet nuget remove source github || true
          dotnet nuget add source "$SRC" \
            --name "github" \
            --username "$OWNER" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          dotnet nuget remove source nuget.org || true
          dotnet nuget add source "https://api.nuget.org/v3/index.json" --name "nuget.org"
          dotnet nuget list source

      - name: Install NuGet.exe
        shell: pwsh
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
            $updatedPath = "$pwd;$env:PATH"
            $env:PATH = $updatedPath
            "PATH=$updatedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Determine assembly version
        id: determine_version
        shell: pwsh
        run: |
          $provided = "${{ github.event.inputs.assembly_version }}"
          if (-not [string]::IsNullOrWhiteSpace($provided)) {
            Write-Warning "Manual assembly version input is ignored. Version will be determined automatically."
          }

          $owner = "${{ github.repository_owner }}"
          $packageName = $null
          $propsPath = "Directory.Build.props"
          if (Test-Path $propsPath) {
            try {
              [xml]$propsXml = Get-Content $propsPath -Raw
              $packageName = $propsXml.Project.PropertyGroup.WisejPackageName
              if ([string]::IsNullOrWhiteSpace($packageName)) {
                Write-Warning "WisejPackageName property not found. Using default package id."
              }
            } catch {
              Write-Warning "Unable to parse Directory.Build.props for package name: $_"
            }
          }
          if ([string]::IsNullOrWhiteSpace($packageName)) {
            $packageName = "Wisej-4"
          }

          $sources = @(
            "https://api.nuget.org/v3/index.json",
            "https://nuget.pkg.github.com/$owner/index.json"
          )

          $semanticVersions = @()
          foreach ($source in $sources) {
            try {
              $listOutput = & nuget.exe list $packageName -Source $source -AllVersions -Prerelease 2>$null
              foreach ($line in $listOutput) {
                if ($line -match "^$packageName\s+(?<ver>[0-9A-Za-z\.-\+]+)$") {
                  $ver = $Matches['ver']
                  try {
                    $semVer = [System.Management.Automation.SemanticVersion]::Parse($ver)
                    $semanticVersions += [PSCustomObject]@{
                      Original = $ver
                      Semantic = $semVer
                    }
                  } catch {
                    Write-Warning "Unable to parse semantic version '$ver' from source '$source'."
                  }
                }
              }
            } catch {
              Write-Warning "Failed to query $source for $packageName: $_"
            }
          }

          $latestVersion = $null
          if ($semanticVersions.Count -gt 0) {
            $latestVersion = ($semanticVersions | Sort-Object Semantic -Descending | Select-Object -First 1).Semantic.Version
            Write-Host "Latest published version for $packageName: $($latestVersion.ToString())"
          } elseif (Test-Path $propsPath) {
            try {
              [xml]$propsXmlForVersion = Get-Content $propsPath -Raw
              $fallbackVersion = $propsXmlForVersion.Project.PropertyGroup.FileVersion
              if (-not [string]::IsNullOrWhiteSpace($fallbackVersion)) {
                $latestVersion = [System.Version]::Parse($fallbackVersion)
                Write-Host "Using Directory.Build.props FileVersion as fallback: $fallbackVersion"
              }
            } catch {
              Write-Warning "Failed to load fallback version from Directory.Build.props: $_"
            }
          }

          if (-not $latestVersion) {
            $latestVersion = [System.Version]::new(4, 0, 0, 0)
            Write-Host "Defaulting base version to $latestVersion"
          }

          $baseMajor = $latestVersion.Major
          $baseMinor = $latestVersion.Minor
          $baseBuild = if ($latestVersion.Build -ge 0) { $latestVersion.Build } else { 0 }
          $baseRevision = if ($latestVersion.Revision -ge 0) { $latestVersion.Revision } else { 0 }
          $nextVersion = [System.Version]::new($baseMajor, $baseMinor, $baseBuild, $baseRevision + 1)
          Write-Host "Next assembly version: $($nextVersion.ToString())"

          $versionString = $nextVersion.ToString()
          "assembly_version=$versionString" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ASSEMBLY_VERSION=$versionString" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update AssemblyInfo version
        if: ${{ steps.determine_version.outputs.assembly_version != '' }}
        shell: pwsh
        run: |
          $newVersion = "${{ steps.determine_version.outputs.assembly_version }}"
          Write-Host "Setting AssemblyInfo versions to $newVersion"

          Get-ChildItem -Path "." -Recurse -Filter "AssemblyInfo.cs" | ForEach-Object {
            $path = $_.FullName
            $content = Get-Content $path -Raw
            $updated = $content `
              -replace '(?<=\[assembly:\s*AssemblyFileVersion\(")[^"]+(?="\)\s*\])', $newVersion `
              -replace '(?<=\[assembly:\s*AssemblyInformationalVersion\(")[^"]+(?="\)\s*\])', $newVersion
            if ($updated -ne $content) {
              Set-Content -Path $path -Value $updated -Encoding UTF8
              Write-Host "Updated: $path"
            }
          }

          $propsPath = "Directory.Build.props"
          if (Test-Path $propsPath) {
            $propsContent = Get-Content $propsPath -Raw
            $propsUpdated = $propsContent -replace '(?<=<FileVersion>)[^<]+(?=</FileVersion>)', $newVersion
            if ($propsUpdated -ne $propsContent) {
              Set-Content -Path $propsPath -Value $propsUpdated -Encoding UTF8
              Write-Host "Updated: $propsPath"
            }
          }

      - name: Restore workloads for mobile builds
        run: |
          dotnet workload restore Wisej.Extensions.sln

      - name: Restore dependencies
        run: dotnet restore Wisej.Extensions.sln

      - name: Build (Release)
        run: dotnet build Wisej.Extensions.sln --configuration Release --no-incremental

      - name: Pack NuGet
        if: ${{ github.event.inputs.pack == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null

          $version = "${{ steps.determine_version.outputs.assembly_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Assembly version could not be determined."
            exit 1
          }

          $channel = "${{ github.event.inputs.package_channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) {
            $channel = 'release'
          }
          $validChannels = @('test','preview','release')
          if ($validChannels -notcontains $channel) {
            Write-Host "Invalid channel '$channel' provided. Falling back to 'release'."
            $channel = 'release'
          }

          $nuspecs = Get-ChildItem -Path "." -Recurse -Include *.nuspec,*.NuSpec -File
          if (-not $nuspecs) {
            Write-Warning "No .nuspec files found. Skipping NuGet packing."
            exit 0
          }

          $tempNuspecDir = Join-Path $env:TEMP "wisej-nuspec"
          New-Item -ItemType Directory -Force -Path $tempNuspecDir | Out-Null

          foreach ($nuspec in $nuspecs) {
            if (-not (Test-Path $nuspec.FullName)) {
              Write-Warning "Skipping missing nuspec at $($nuspec.FullName)"
              continue
            }

            $nuspecDirectory = $nuspec.Directory
            if (-not $nuspecDirectory) {
              Write-Warning "Skipping $($nuspec.FullName) because the directory could not be resolved."
              continue
            }

            $adjustedNuspecPath = $nuspec.FullName
            $shouldUseTemp = $false
            try {
              [xml]$nuspecXml = Get-Content $nuspec.FullName -Raw
              $filesNodes = @()
              if ($nuspecXml.package.files) {
                $filesNodes = @($nuspecXml.package.files.file)
              }

              foreach ($fileNode in $filesNodes) {
                if (-not $fileNode -or -not $fileNode.src) {
                  continue
                }

                $srcValue = $fileNode.src.ToString()
                if ($srcValue -match '(?i)Wisej\.png$' -and -not ($srcValue -match '^\.\.\\')) {
                  $resolvedPath = Join-Path $nuspecDirectory.FullName $srcValue
                  if (-not (Test-Path $resolvedPath)) {
                    $parent = $nuspecDirectory.Parent
                    if ($parent) {
                      $iconCandidates = @(
                        Join-Path $parent.FullName "Wisej.png",
                        Join-Path $parent.FullName "wisej.png"
                      ) | Where-Object { Test-Path $_ }

                      if ($iconCandidates.Count -gt 0) {
                        $iconLeaf = Split-Path $iconCandidates[0] -Leaf
                        $fileNode.src = "..\\$iconLeaf"
                        Write-Host "Updated icon source for $($nuspec.Name) to ..\\$iconLeaf"
                        $shouldUseTemp = $true
                      } else {
                        Write-Warning "Wisej.png not found for $($nuspec.Name)."
                      }
                    } else {
                      Write-Warning "Cannot locate parent directory for $($nuspec.Name) to resolve Wisej.png."
                    }
                  }
                }
              }

              if ($shouldUseTemp) {
                $tempPath = Join-Path $tempNuspecDir $nuspec.Name
                $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                $writer = New-Object System.IO.StreamWriter($tempPath, $false, $utf8NoBom)
                $nuspecXml.Save($writer)
                $writer.Close()
                $adjustedNuspecPath = $tempPath
              }
            } catch {
              Write-Warning "Failed to adjust nuspec $($nuspec.FullName): $_"
            }

            Write-Host "Packing $($nuspec.FullName) with version $version"
            nuget.exe pack $adjustedNuspecPath -Version $version -OutputDirectory ./artifacts -Properties "version=$version"

            try {
              [xml]$nuspecXml = Get-Content $nuspec.FullName -Raw
              $pkgId = $nuspecXml.package.metadata.id
            } catch {
              Write-Warning "Unable to parse package id for $($nuspec.Name): $_"
              $pkgId = $nuspec.BaseName
            }

            if ([string]::IsNullOrWhiteSpace($pkgId)) {
              $pkgId = $nuspec.BaseName
            }

            $expected = Join-Path "./artifacts" "$pkgId.$version.nupkg"
            if (-not (Test-Path $expected)) {
              $built = Get-ChildItem "./artifacts" -Filter "$pkgId*.nupkg" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($built) {
                $expected = $built.FullName
              } else {
                Write-Warning "No package file found for $pkgId after packing."
                continue
              }
            }

            $destPath = Join-Path "./artifacts" ("$pkgId-$channel-$version.nupkg")
            Move-Item -Force $expected $destPath
            Write-Host "Renamed package to $destPath"
          }

      - name: Upload NuGet artifacts
        if: ${{ github.event.inputs.pack == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: ${{ github.event.inputs.pack == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          SRC="https://nuget.pkg.github.com/${OWNER}/index.json"
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "$SRC" \
              --skip-duplicate
          done

      - name: Commit version bump
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.assembly_version != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump AssemblyInfo version to ${{ github.event.inputs.assembly_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No version changes to commit."
          fi
